  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <rect width="64" height="64" rx="15" fill="url(#haze)"/>
  <rect x="13" y="13" width="38" height="38" rx="5" fill="url(#con)"/>
  <rect x="17.5" y="17.5" width="29" height="29" rx="4" fill="none" stroke="#4be8ff" stroke-width="2"/>
  <g fill="url(#bar)" stroke="#fff" stroke-opacity=".8" stroke-width=".6">
    <circle cx="21.5" cy="21.5" r="3"/><circle cx="32" cy="21.5" r="3"/><circle cx="42.5" cy="21.5" r="3"/>
    <circle cx="42.5" cy="32" r="3"/><circle cx="42.5" cy="42.5" r="3"/><circle cx="32" cy="42.5" r="3"/>
    <circle cx="21.5" cy="42.5" r="3"/><circle cx="21.5" cy="32" r="3"/>
  </g>
</svg>
