<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Logo: sección de columna con estribo cian y 8 varillas -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a414d"/>
      <stop offset="1" stop-color="#0f1217"/>
    </linearGradient>
    <radialGradient id="haze" cx=".15" cy=".1" r=".8">
      <stop offset="0" stop-color="#cfd7e4" stop-opacity=".45"/>
      <stop offset="1" stop-color="#cfd7e4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="con" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f6f9"/>
      <stop offset="1" stop-color="#d4d9e1"/>
    </linearGradient>
    <radialGradient id="bar" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#b2c8ff"/>
      <stop offset=".55" stop-color="#3b6cf6"/>
      <stop offset="1" stop-color="#1f43c4"/>
